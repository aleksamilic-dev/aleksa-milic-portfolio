<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="900" height="580" fill="#080b10"/>

  <!-- corner caption -->
  <text x="54" y="52" fill="#647684" font-size="13" letter-spacing="3">SINGLE-NODE vs SPARK</text>
  <text x="54" y="74" fill="#647684" font-size="12.5" letter-spacing="1" opacity="0.75">TPC-H · total workload time · log scale</text>

  <!-- gridlines + y labels (1s / 10s / 100s) -->
  <g stroke="#96b6cd" stroke-opacity="0.10">
    <line x1="150" y1="429" x2="820" y2="429"/>
    <line x1="150" y1="260" x2="820" y2="260"/>
    <line x1="150" y1="90"  x2="820" y2="90"/>
  </g>
  <g fill="#5d7280" font-size="11" text-anchor="end">
    <text x="140" y="433">1 s</text>
    <text x="140" y="264">10 s</text>
    <text x="140" y="94">100 s</text>
  </g>

  <!-- x axis -->
  <line x1="150" y1="500" x2="820" y2="500" stroke="#96b6cd" stroke-opacity="0.2"/>
  <g fill="#a2b4c1" font-size="12" text-anchor="middle">
    <text x="180" y="522">SF1  ·  ~1 GB</text>
    <text x="760" y="522">SF10  ·  ~10 GB</text>
  </g>

  <!-- Spark band (local / tuned / 2-worker cluster) -->
  <path d="M180 261 L760 119 L760 86 L180 244 Z" fill="#ff9d4d" fill-opacity="0.12" stroke="#ff9d4d" stroke-opacity="0.35" stroke-width="1"/>
  <polyline points="180,256 760,104" fill="none" stroke="#ff9d4d" stroke-width="2.4"/>
  <g fill="#ff9d4d"><circle cx="180" cy="256" r="4.5"/><circle cx="760" cy="104" r="4.5"/></g>
  <text x="470" y="150" fill="#ffc794" font-size="13.5" text-anchor="middle" letter-spacing="0.5">Apache Spark</text>

  <!-- in-process band (DuckDB / Polars / DataFusion) -->
  <path d="M180 466 L760 277 L760 228 L180 437 Z" fill="#4d9fd6" fill-opacity="0.16" stroke="#4d9fd6" stroke-opacity="0.4" stroke-width="1"/>
  <polyline points="180,466 760,277" fill="none" stroke="#9ad7f5" stroke-width="2.4"/>
  <g fill="#9ad7f5"><circle cx="180" cy="466" r="4.5"/><circle cx="760" cy="277" r="4.5"/></g>
  <text x="470" y="405" fill="#9ad7f5" font-size="13.5" text-anchor="middle" letter-spacing="0.5">DuckDB · Polars · DataFusion</text>

  <!-- the gap annotation -->
  <g stroke="#5fd39a" stroke-opacity="0.5" stroke-dasharray="3 4">
    <line x1="760" y1="118" x2="760" y2="272"/>
  </g>
  <g fill="#5fd39a">
    <path d="M756 122l4 -8 4 8z"/><path d="M756 268l4 8 4 -8z"/>
  </g>
  <text x="784" y="200" fill="#5fd39a" font-size="12.5">≈ 10×</text>
  <text x="784" y="218" fill="#647684" font-size="11">and holding</text>

  <!-- footnote -->
  <text x="150" y="556" fill="#5d7280" font-size="11">96/96 cross-engine correctness checks · same Parquet for every engine · 2-worker Spark cluster via docker-compose</text>
</svg>
