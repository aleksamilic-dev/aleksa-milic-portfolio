<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="900" height="640" fill="#080b10"/>

  <!-- faint grid wash -->
  <g stroke="#96b6cd" stroke-opacity="0.05">
    <path d="M0 160H900M0 320H900M0 480H900"/>
    <path d="M150 0V640M450 0V640M750 0V640"/>
  </g>

  <!-- corner caption -->
  <text x="52" y="58" fill="#647684" font-size="13" letter-spacing="3">STAR SCHEMA</text>
  <text x="52" y="80" fill="#647684" font-size="13" letter-spacing="1.5" opacity="0.7">dbt · DuckDB</text>

  <!-- connectors: each dimension to the fact -->
  <g stroke="#96b6cd" stroke-opacity="0.34" stroke-width="1.5">
    <line x1="256" y1="196" x2="392" y2="270"/>
    <line x1="450" y1="150" x2="450" y2="258"/>
    <line x1="644" y1="196" x2="508" y2="270"/>
    <line x1="256" y1="452" x2="392" y2="350"/>
    <line x1="644" y1="452" x2="508" y2="350"/>
  </g>
  <g fill="#ff9d4d" fill-opacity="0.55">
    <circle cx="392" cy="270" r="3"/><circle cx="450" cy="258" r="3"/>
    <circle cx="508" cy="270" r="3"/><circle cx="392" cy="350" r="3"/>
    <circle cx="508" cy="350" r="3"/>
  </g>

  <!-- fact table -->
  <g>
    <rect x="350" y="258" width="200" height="94" rx="4"
          fill="#ff9d4d" fill-opacity="0.10" stroke="#ff9d4d" stroke-width="1.6"/>
    <text x="450" y="298" text-anchor="middle" fill="#eef3f7" font-size="15">fct_harvest</text>
    <text x="450" y="318" text-anchor="middle" fill="#eef3f7" font-size="15">_delivery</text>
    <text x="450" y="339" text-anchor="middle" fill="#ff9d4d" font-size="10.5" letter-spacing="1">grain · one lot</text>
  </g>

  <!-- dimensions -->
  <g font-size="13.5" text-anchor="middle">
    <!-- top -->
    <rect x="366" y="96" width="168" height="54" rx="4" fill="#4d9fd6" fill-opacity="0.08" stroke="#4d9fd6" stroke-width="1.4"/>
    <text x="450" y="129" fill="#cfe0ec">dim_crop</text>

    <!-- upper left (SCD2) -->
    <rect x="96" y="150" width="176" height="54" rx="4" fill="#4d9fd6" fill-opacity="0.08" stroke="#4d9fd6" stroke-width="1.4"/>
    <text x="184" y="183" fill="#cfe0ec">dim_grower</text>
    <rect x="238" y="139" width="52" height="20" rx="10" fill="#5fd39a" fill-opacity="0.14" stroke="#5fd39a" stroke-width="1"/>
    <text x="264" y="153" fill="#5fd39a" font-size="10" letter-spacing="0.5">SCD2</text>

    <!-- upper right -->
    <rect x="628" y="150" width="176" height="54" rx="4" fill="#4d9fd6" fill-opacity="0.08" stroke="#4d9fd6" stroke-width="1.4"/>
    <text x="716" y="183" fill="#cfe0ec">dim_buyer</text>

    <!-- lower left (SCD2) -->
    <rect x="96" y="452" width="176" height="54" rx="4" fill="#4d9fd6" fill-opacity="0.08" stroke="#4d9fd6" stroke-width="1.4"/>
    <text x="184" y="485" fill="#cfe0ec">dim_field</text>
    <rect x="238" y="441" width="52" height="20" rx="10" fill="#5fd39a" fill-opacity="0.14" stroke="#5fd39a" stroke-width="1"/>
    <text x="264" y="455" fill="#5fd39a" font-size="10" letter-spacing="0.5">SCD2</text>

    <!-- lower right -->
    <rect x="628" y="452" width="176" height="54" rx="4" fill="#4d9fd6" fill-opacity="0.08" stroke="#4d9fd6" stroke-width="1.4"/>
    <text x="716" y="485" fill="#cfe0ec">dim_date</text>
  </g>

  <!-- pipeline ribbon -->
  <g font-size="11.5" text-anchor="middle" fill="#647684">
    <line x1="150" y1="586" x2="750" y2="586" stroke="#96b6cd" stroke-opacity="0.18"/>
    <g>
      <rect x="150" y="572" width="96" height="28" rx="14" fill="#0c1219" stroke="#96b6cd" stroke-opacity="0.22"/>
      <text x="198" y="590">raw</text>
    </g>
    <g>
      <rect x="298" y="572" width="110" height="28" rx="14" fill="#0c1219" stroke="#96b6cd" stroke-opacity="0.22"/>
      <text x="353" y="590">staging</text>
    </g>
    <g>
      <rect x="460" y="572" width="110" height="28" rx="14" fill="#0c1219" stroke="#96b6cd" stroke-opacity="0.22"/>
      <text x="515" y="590">marts</text>
    </g>
    <g>
      <rect x="622" y="572" width="128" height="28" rx="14" fill="#0c1219" stroke="#96b6cd" stroke-opacity="0.22"/>
      <text x="686" y="590">docs site</text>
    </g>
    <g fill="#96b6cd" fill-opacity="0.45">
      <path d="M272 586l-11-4v8z"/><path d="M434 586l-11-4v8z"/><path d="M596 586l-11-4v8z"/>
    </g>
    <rect x="470" y="612" width="92" height="20" rx="10" fill="#5fd39a" fill-opacity="0.12" stroke="#5fd39a" stroke-opacity="0.6" stroke-width="1"/>
    <text x="516" y="626" fill="#5fd39a">65 tests ok</text>
  </g>
</svg>
